apiVersion: v1
kind: ConfigMap
metadata:
  name: social-os-config
  namespace: social-os
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/social_os"
  REDIS_URL: "redis://redis:6379/0"
  CORS_ORIGINS: '["https://app.example.com"]'
  DEFAULT_AI_PROVIDER: "openai"
  NEXT_PUBLIC_API_URL: "https://api.example.com"
