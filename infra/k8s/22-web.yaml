apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: social-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: social-os/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: social-os-config
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: social-os
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
